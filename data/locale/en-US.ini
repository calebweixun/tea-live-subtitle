TeaLiveSubtitle.Prop.StableCaptions.Tooltip="Show only text the server has committed (transcript.stable), so shown characters are never rewritten. Off: show the live partial preview, which may change. Used only when the server supports it. This is a session setting: it takes effect with Apply connection settings."
TeaLiveSubtitle.Prop.ConnectionHint="Server, port, token, stable-caption, sentence-break and recognition hint changes take effect when you press \"Apply connection settings\" or close this window. Everything else applies immediately."
TeaLiveSubtitle.Prop.ApplyConnection="Apply connection settings"
TeaLiveSubtitle.Prop.EventTrace="Record recognition events (debugging)"
TeaLiveSubtitle.Prop.EventTrace.Tooltip="Writes every server event of each session to a file (one per session, size-capped) in the plugin's config folder; the path is in the OBS log. Send it to us when captions go missing. Takes effect with Apply connection settings."
TeaLiveSubtitle.Prop.DiagOverlay="Show a diagnostic status line (debugging)"
TeaLiveSubtitle.Prop.DiagOverlay.Tooltip="One small line under the captions: connection, whether the server hears speech, the input level and the time since the last text. Use it in a preview scene to see why captions are missing."
