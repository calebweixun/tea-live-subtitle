TeaLiveSubtitle.Dialog.Note="Server address, token path and audio source are configured per caption source (open its Properties). Only one continuous session is allowed by the server at a time -- if you use more than one TEA Live Subtitle source, only the first to connect will stay connected. This window shows every source's live connection status."
