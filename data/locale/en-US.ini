TeaLiveSubtitle.Prop.PunctBreak.Comma="After sentence ends and commas (，、)"
TeaLiveSubtitle.Prop.PunctBreak.Tooltip="Start a new row right after punctuation inside one server sentence. Helps with fast speakers who rarely pause long enough for the sentence break. The mark stays at the end of its row; text already on screen never moves. Full-width and ASCII marks count alike; decimal points, thousands separators and abbreviations (e.g. Mr.) never break."
