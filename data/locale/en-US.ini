TeaLiveSubtitle.Prop.LineBreakPause="Sentence break pause (ms, 0 = off)"
TeaLiveSubtitle.Prop.LineBreakPause.Tooltip="Start a new row when the caption has not changed for this long. Every new server segment (the server cuts after ~0.9 s of silence) already starts a new row; this adds breaks for long pauses inside one segment."
