TeaLiveSubtitle.Prop.UnstableTail.Tooltip="Stable captions only. After the confirmed text, show (fainter) what the newest preview has beyond it. Shown text never goes backwards: unconfirmed words may be corrected, never removed, and a line keeps what it shows when its sentence ends."
TeaLiveSubtitle.Prop.UnstableTailOpacity="Not-yet-confirmed text opacity (%)"

