TeaLiveSubtitle.Prop.Hints.Group="Recognition hints (experimental)"
TeaLiveSubtitle.Prop.Hints.Hint="Experimental. Sent to the server when the session starts: changes apply with \"Apply connection settings\" or when this window closes, never live. The hints file is read again at every connection, so you can keep and grow it outside OBS."
TeaLiveSubtitle.Prop.Hints.Profile="Dictionary profile"
TeaLiveSubtitle.Prop.Hints.Profile.Tooltip="A dictionary file kept on the server (its hotwords and replacements apply first, then the fields below). Pick one from the list, type a name, or choose (none)."
TeaLiveSubtitle.Prop.Hints.ProfileNone="(none)"
TeaLiveSubtitle.Prop.Hints.Domain="Setting description"
TeaLiveSubtitle.Prop.Hints.Domain.Tooltip="A few sentences about what is being said, e.g. \"a Sunday sermon on Ephesians 2\". Replaces the profile's description. The character count against the server's limit is in the status line."
TeaLiveSubtitle.Prop.Hints.Hotwords="Hotwords"
TeaLiveSubtitle.Prop.Hints.Hotwords.Tooltip="One word or name per line. Blank lines and lines starting with # are ignored. Added after the profile's and the file's hotwords."
TeaLiveSubtitle.Prop.Hints.Replacements="Replacement table"
TeaLiveSubtitle.Prop.Hints.Replacements.Tooltip="One pair per line: wrong => right (also wrong=>right, or separated by a tab). # starts a comment. Nothing after => deletes the wrong text. Overrides the profile's and the file's pair for the same wrong text."
TeaLiveSubtitle.Prop.Hints.File="Load from file"
TeaLiveSubtitle.Prop.Hints.File.Tooltip="Optional UTF-8 text file with a [專有詞] section (one hotword per line) and a [對照表] section (wrong => right); [hotwords] and [replacements] work too. It is read again at every connection and merged before the fields above, so you can keep growing it outside OBS."
TeaLiveSubtitle.Prop.Hints.Refresh="Refresh status"
TeaLiveSubtitle.Prop.Hints.Supported="The server supports recognition hints. Limits:"
TeaLiveSubtitle.Prop.Hints.LimitsLegend=" (description chars / hotwords (chars each) / replacements (chars each))"
TeaLiveSubtitle.Prop.Hints.Off="The server has recognition hints turned off, so these settings are not sent. A server that supports them enables them with the server setting TEA_ASR_CONTEXT_HINTS=1."
TeaLiveSubtitle.Prop.Hints.Unsupported="This server does not support recognition hints; these settings are not sent."
TeaLiveSubtitle.Prop.Hints.Unknown="Not connected yet: the server's support for recognition hints is unknown."
