TeaLiveSubtitle.Prop.SentenceBreak="Sentence break silence (ms, 0 = server default)"
TeaLiveSubtitle.Prop.SentenceBreak.Tooltip="How long a silence the server's voice detector waits for before it ends a sentence; every sentence starts a new line. Shorter: more, shorter lines; longer: fewer, longer lines. Sent to the server (session setting): takes effect with Apply connection settings."
