TeaLiveSubtitle.Prop.AutoModeHint="Auto mode without a legacy content width never wraps: long sentences keep growing sideways. Switch to \"Fixed Width\" to wrap at the box width."
TeaLiveSubtitle.Prop.MaxVisibleRows="Max rows on screen (0 = no limit)"
TeaLiveSubtitle.Prop.MaxVisibleRows.Tooltip="Counts wrapped rows. When a new row would exceed the limit, the oldest row leaves the screen as a whole; text inside a row never changes."
TeaLiveSubtitle.Prop.PunctBreak="Line break at punctuation"
TeaLiveSubtitle.Prop.PunctBreak.Off="Off"
TeaLiveSubtitle.Prop.PunctBreak.Sentence="After sentence ends (。？！…；)"
TeaLiveSubtitle.Prop.PunctBreak.Comma="After sentence ends and commas (，、)"
TeaLiveSubtitle.Prop.PunctBreak.Tooltip="Start a new row right after punctuation inside one server sentence. Helps with fast speakers who rarely pause long enough for the sentence break. The mark stays at the end of its row; text already on screen never moves. Full-width and ASCII marks count alike; decimal points, thousands separators and abbreviations (e.g. Mr.) never break."
TeaLiveSubtitle.Prop.PunctCommaMin="Minimum characters on a row before a comma breaks"
TeaLiveSubtitle.Prop.SentenceBreak="Sentence break silence (ms, 0 = server default)"
TeaLiveSubtitle.Prop.SentenceBreak.Tooltip="How long a silence the server's voice detector waits for before it ends a sentence; every sentence starts a new line. Shorter: more, shorter lines; longer: fewer, longer lines. Sent to the server (session setting): takes effect with Apply connection settings."
TeaLiveSubtitle.Prop.SentenceBreak.Unknown="Sentence break: not connected yet, so the server's support is unknown."
TeaLiveSubtitle.Prop.SentenceBreak.Unsupported="This server does not support setting the sentence break: it uses its own value and this setting is not sent."
TeaLiveSubtitle.Prop.SentenceBreak.Supported="Supported by this server (values outside the range are clamped). Range / server default / current session:"
TeaLiveSubtitle.Prop.FadeIn="Fade in new text"
TeaLiveSubtitle.Prop.FadeOut="Fade out old captions"
TeaLiveSubtitle.Prop.FadeOutDelay="Fade out after (ms without changes)"
TeaLiveSubtitle.Prop.FadeDuration="Fade in/out duration (ms)"
TeaLiveSubtitle.Prop.UnstableTail="Show not-yet-confirmed text (fainter)"
TeaLiveSubtitle.Prop.UnstableTail.Tooltip="Stable captions only. After the confirmed text, show (fainter) what the newest preview has beyond it. Shown text never goes backwards: unconfirmed words may be corrected, never removed, and a line keeps what it shows when its sentence ends."
TeaLiveSubtitle.Prop.UnstableTailOpacity="Not-yet-confirmed text opacity (%)"

