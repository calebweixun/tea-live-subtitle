TeaLiveSubtitle.Prop.PunctBreak.Off="關閉"
TeaLiveSubtitle.Prop.PunctBreak.Sentence="句末（。？！…；）"
TeaLiveSubtitle.Prop.PunctBreak.Comma="句末＋逗號（，、）"
TeaLiveSubtitle.Prop.PunctBreak.Tooltip="在伺服器同一句之內，遇到標點就換到新的一行。講話很快、很少停頓到觸發換句偵測時間時特別有用。標點留在它結束的那一行，畫面上已經出現的字不會移動。全形與半形標點一視同仁；小數點、千分位與縮寫（例如 Mr.）不會換行。"
TeaLiveSubtitle.Prop.PunctCommaMin="逗號換行最短字數"
TeaLiveSubtitle.Prop.SentenceBreak="換句偵測時間（毫秒，0＝伺服器預設）"
TeaLiveSubtitle.Prop.SentenceBreak.Tooltip="伺服器的語音偵測（VAD）要等多長的靜音才結束一句；每一句從新的一行開始。越短：行越多越短；越長：行越少越長。這是送給伺服器的連線設定，按「套用連線設定」後生效。"
TeaLiveSubtitle.Prop.SentenceBreak.Unknown="換句偵測時間：尚未連線，還不知道伺服器是否支援。"
TeaLiveSubtitle.Prop.SentenceBreak.Unsupported="這台伺服器不支援設定換句偵測時間：它使用自己的預設值，這個設定不會送出。"
TeaLiveSubtitle.Prop.SentenceBreak.Supported="這台伺服器支援（超出範圍的值會自動調整）。範圍／伺服器預設／目前連線："
