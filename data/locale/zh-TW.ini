TeaLiveSubtitle.Prop.StableCaptions.Tooltip="只顯示伺服器已確定的文字（transcript.stable），畫面上已出現的字不會被改掉。關閉時改顯示即時預覽，文字可能會變動。伺服器支援時才會使用。這是連線階段的設定，按「套用連線設定」後生效。"
TeaLiveSubtitle.Prop.ConnectionHint="伺服器位址、連接埠、Token、穩定字幕、換句偵測時間與辨識提示的變更，要按「套用連線設定」或關閉這個視窗才會生效；其他設定會立即套用。"
TeaLiveSubtitle.Prop.ApplyConnection="套用連線設定"
TeaLiveSubtitle.Prop.EventTrace="記錄辨識事件（除錯用）"
TeaLiveSubtitle.Prop.EventTrace.Tooltip="把每次連線的所有伺服器事件寫成檔案（每個連線一個檔、有大小上限），存在外掛的設定資料夾，路徑會寫在 OBS 記錄檔。字幕不見時把這個檔案傳給我們。按「套用連線設定」後生效。"
