TeaLiveSubtitle.Prop.UnstableTail="顯示未確定文字（較淡）"
TeaLiveSubtitle.Prop.UnstableTail.Tooltip="僅限穩定字幕。在已確定的文字後面，以較淡的樣式顯示最新預覽中伺服器還沒確定的部分。已確定的字永遠不會改；只有這段較淡的尾巴可能變動。"
TeaLiveSubtitle.Prop.UnstableTailOpacity="未確定文字不透明度（%）"

TeaLiveSubtitle.Dialog.Title="TEA ASR 字幕設定"
TeaLiveSubtitle.Dialog.Note="伺服器位址、Token 路徑與音訊來源請到各字幕來源自己的「內容」面板設定。伺服器一次只允許一個連續 session：若同時使用超過一個 TEA 即時字幕來源，只有先連上的那一個會保持連線。這個視窗會顯示所有來源目前的連線狀態。"
