TeaLiveSubtitle.Prop.StableCaptions.Tooltip="只顯示伺服器已確定的文字（transcript.stable），畫面上已出現的字不會被改掉。關閉時改顯示即時預覽，文字可能會變動。伺服器支援時才會使用。這是連線階段的設定，按「套用連線設定」後生效。"
TeaLiveSubtitle.Prop.ConnectionHint="伺服器位址、連接埠、Token、穩定字幕與換句偵測時間的變更，要按「套用連線設定」或關閉這個視窗才會生效；其他設定會立即套用。"
TeaLiveSubtitle.Prop.ApplyConnection="套用連線設定"
TeaLiveSubtitle.Prop.Outline.Tooltip="OBS 文字引擎的描邊固定是黑色，沒有描邊顏色可以設定。"
TeaLiveSubtitle.Prop.TextBackground="文字底色"
TeaLiveSubtitle.Prop.TextBackgroundColor="文字底色顏色"
TeaLiveSubtitle.Prop.TextBackgroundPadding="文字底色內距（像素）"
TeaLiveSubtitle.Prop.AutoModeHint="自動模式在沒有設定舊版內容寬度時不會換行，長句會一直往旁邊長。改成「固定寬度」即可依字幕框寬度自動換行。"
TeaLiveSubtitle.Prop.MaxVisibleRows="畫面最多顯示行數（含折行，0＝不限）"
TeaLiveSubtitle.Prop.MaxVisibleRows.Tooltip="以折行後的實際行數計算。新的一行會超過上限時，最舊的一行整行離開畫面；行內已顯示的字不會改變。"
TeaLiveSubtitle.Prop.PunctBreak="標點換行"
TeaLiveSubtitle.Prop.PunctBreak.Off="關閉"
TeaLiveSubtitle.Prop.PunctBreak.Sentence="句末（。？！…；）"
TeaLiveSubtitle.Prop.PunctBreak.Comma="句末＋逗號（，、）"
TeaLiveSubtitle.Prop.PunctBreak.Tooltip="在伺服器同一句之內，遇到標點就換到新的一行。講話很快、很少停頓到觸發換句偵測時間時特別有用。標點留在它結束的那一行，畫面上已經出現的字不會移動。全形與半形標點一視同仁；小數點、千分位與縮寫（例如 Mr.）不會換行。"
TeaLiveSubtitle.Prop.PunctCommaMin="逗號換行最短字數"
TeaLiveSubtitle.Prop.SentenceBreak="換句偵測時間（毫秒，0＝伺服器預設）"
TeaLiveSubtitle.Prop.SentenceBreak.Tooltip="伺服器的語音偵測（VAD）要等多長的靜音才結束一句；每一句從新的一行開始。越短：行越多越短；越長：行越少越長。這是送給伺服器的連線設定，按「套用連線設定」後生效。"
TeaLiveSubtitle.Prop.SentenceBreak.Unknown="換句偵測時間：尚未連線，還不知道伺服器是否支援。"
TeaLiveSubtitle.Prop.SentenceBreak.Unsupported="這台伺服器不支援設定換句偵測時間：它使用自己的預設值，這個設定不會送出。"
TeaLiveSubtitle.Prop.SentenceBreak.Supported="這台伺服器支援（超出範圍的值會自動調整）。範圍／伺服器預設／目前連線："
